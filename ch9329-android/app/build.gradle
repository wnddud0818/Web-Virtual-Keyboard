plugins { id 'com.android.application' }
android {
    namespace 'com.wnddud.hiddesk'
    compileSdk 35
    defaultConfig {
        applicationId 'com.wnddud.hiddesk'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.0.3'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // Reuse a private local development key when present; fresh clones use
    // Android's standard debug signing configuration.
    if (rootProject.file('debug.keystore').exists()) {
        signingConfigs {
            debug {
                storeFile rootProject.file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation files('libs/usb-serial-for-android-3.11.0.jar') }
tasks.register('prepareWebAssets', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/prepare_assets.py'
}
tasks.named('preBuild') { dependsOn 'prepareWebAssets' }
